name: Generate Gradle wrapper

# Run manually once: Actions tab > Generate Gradle wrapper > Run workflow.
# Creates gradlew + wrapper jar and pushes them to branch step-0-gradle-wrapper.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Push to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b step-0-gradle-wrapper
          git add -f gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m "chore: add Gradle wrapper"
          git push origin step-0-gradle-wrapper
